# XcodeGen project definition.
#
#   brew install xcodegen && xcodegen generate && open FarsiVault.xcodeproj
#
# Keeping the project as YAML rather than a checked-in .xcodeproj means adding a
# file is just adding a file — no unreadable pbxproj merge conflicts.
name: FarsiVault

options:
  bundleIdPrefix: com.farsivault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Xcode fills this from your Apple ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FarsiVault:
    type: application
    platform: iOS
    sources:
      - path: FarsiVault
        excludes:
          - "Resources/seed_sentences.json"
      - path: FarsiVault/Resources/seed_sentences.json
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farsivault.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FarsiVault/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  FarsiVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FarsiVaultTests
    dependencies:
      - target: FarsiVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farsivault.app.tests

schemes:
  FarsiVault:
    build:
      targets:
        FarsiVault: all
    test:
      targets:
        - FarsiVaultTests
    run:
      config: Debug
