<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#fbfaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farsi Vault">
<title>Farsi Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main id="screens">

  <!-- Today -->
  <section class="screen is-active" id="screen-today">
    <header class="screen-head"><h1 data-t="tab.today">Today</h1></header>

    <div class="today-body">
      <div class="ledger" id="counts">
        <div class="ledger-row lead"><span data-t="today.level">Level</span><b id="level-now">A1</b></div>
        <div class="ledger-row lead"><span data-t="today.due">Due</span><b id="count-due">0</b></div>
        <div class="ledger-row lead"><span data-t="today.new">New</span><b id="count-new">0</b></div>
      </div>

      <p class="empty" id="today-empty" data-t="today.empty" hidden>
        No sentences yet.
      </p>

      <div class="passed-panel" id="passed-panel" hidden>
        <p class="passed-head" id="passed-head"></p>
        <p class="hint" id="passed-note"></p>
        <button id="btn-advance" data-t="today.unlock">Unlock</button>
      </div>

      <button id="btn-start">Start &rarr;</button>

    </div>

  </section>

  <!-- Weak spots -->
  <section class="screen" id="screen-weak">
    <header class="screen-head"><h1 data-t="tab.progress">Progress</h1></header>
    <div class="list">
      <div class="ledger" id="today-stats">
        <div class="ledger-row"><span data-t="today.streak">Streak</span><b id="streak">0 days</b></div>
        <div class="ledger-row"><span data-t="today.held">Sentences</span><b id="count-held">0</b></div>
      </div>
      <div id="gate-block"></div>
      <div class="register" id="register" hidden>
        <div class="ledger-row is-head">
          <span data-t="today.session">Session</span><b class="col-n" data-t="today.cards">Cards</b><b class="col-pct" data-t="today.right">Right</b>
        </div>
        <div id="register-rows"></div>
      </div>
      <h2 class="list-head" data-t="progress.weakSpots">Weak spots</h2>
      <div id="weak-list"></div>
    </div>
  </section>

  <!-- Settings -->
  <section class="screen" id="screen-settings">
    <header class="screen-head"><h1 data-t="tab.settings">Settings</h1></header>
    <div class="list settings">

      <div class="group">
        <h2 data-t="settings.practice">Practice</h2>
        <label><span data-t="settings.newPerDay">New cards a day</span> <b id="new-value">20</b>
          <input type="range" id="set-new" min="0" max="60" step="5">
        </label>
        <p class="hint" data-t="settings.newPerDayHint"></p>
        <label><span data-t="settings.perRound">Cards per round</span> <b id="round-value">20</b>
          <input type="range" id="set-round" min="5" max="60" step="5">
        </label>
        <p class="hint" data-t="settings.perRoundHint"></p>
      </div>

      <div class="group">
        <h2 data-t="settings.level">Level</h2>
        <label class="row">
          <span data-t="settings.currentLevel">Current level</span>
          <select id="set-level"></select>
        </label>
        <p class="hint" data-t="settings.levelHint"></p>
      </div>

      <div class="group">
        <h2 data-t="settings.audio">Audio</h2>
        <label class="row">
          <span data-t="settings.speak">Read answers aloud</span>
          <input type="checkbox" id="set-speak">
        </label>
        <p class="hint" id="voice-report" data-t="settings.voiceChecking"></p>
      </div>

      <div class="group">
        <h2 data-t="settings.backup">Backup</h2>
        <div class="button-row">
          <button id="btn-export" data-t="settings.exportBackup">Save a backup</button>
          <button id="btn-import" data-t="settings.importBackup">Restore</button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <p class="hint" id="backup-report" data-t="settings.backupHint"></p>
      </div>

      <div class="group">
        <h2 data-t="bank.title">My sentences</h2>
        <label><span data-t="bank.english">English</span>
          <input type="text" id="bank-en" autocomplete="off">
        </label>
        <label><span data-t="bank.farsi">Farsi</span>
          <input type="text" id="bank-fa" class="rtl" autocomplete="off"
                 autocapitalize="off" spellcheck="false">
        </label>
        <label><span data-t="bank.finglish">Pronunciation</span>
          <input type="text" id="bank-tr" autocomplete="off"
                 autocapitalize="off" spellcheck="false">
        </label>
        <button id="btn-bank-add" data-t="bank.add">Add</button>
        <p class="hint" id="bank-status"></p>
        <div id="bank-list"></div>
        <p class="hint" data-t="bank.hint"></p>
      </div>

      <div class="group" id="keys-group">
        <h2 data-t="settings.keyboard">Keyboard</h2>
        <p class="hint" data-t="settings.keyboardHint"></p>
      </div>

      <div class="group">
        <h2 data-t="settings.privacy">What leaves this device</h2>
        <p class="hint" data-t="settings.privacyHint"></p>
      </div>

    </div>
  </section>

</main>

<nav class="tabs">
  <button data-screen="today" class="is-active" data-t="tab.today">Today</button>
  <button data-screen="weak" data-t="tab.progress">Progress</button>
  <button data-screen="settings" data-t="tab.settings">Settings</button>
</nav>

<!-- Practice overlay -->
<div class="practice" id="practice" hidden>
  <header class="practice-head">
    <button id="btn-quit">&larr; <span data-t="card.exit">Exit</span></button>
    <span class="progress" id="practice-progress">0 / 0</span>
    <button id="btn-undo" hidden data-t="card.undo">Undo</button>
  </header>


  <div class="card-scroll">
   <div id="card-view">
    <p class="badge" id="card-badge"></p>
    <p class="prompt" id="card-prompt"></p>

    <textarea id="card-typed" class="typed" rows="2" hidden
              autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

    <div id="card-answer" class="answer" hidden>
      <p class="typed-echo" id="typed-echo" hidden></p>
      <p class="answer-text" id="answer-text"></p>
      <p class="finglish" id="answer-finglish"></p>
      <p class="gloss" id="answer-gloss"></p>
      <div class="breakdown" id="answer-breakdown" hidden></div>
      <div class="alts" id="answer-alts" hidden></div>
    </div>
   </div>

    <div class="done-panel" id="done-view" hidden>
      <h2 data-t="card.done">Done</h2>
      <p class="note" id="done-summary"></p>
      <p class="note-faint" id="done-next"></p>
    </div>
  </div>

  <div class="controls">
    <div id="input-row" class="input-row">
      <button id="btn-type" data-t="card.type">Type</button>
    </div>
    <button id="btn-reveal"><span data-t="card.reveal">Reveal</span> &rarr;</button>
    <div id="rating-row" class="rating-row" hidden></div>
    <div id="done-row" class="done-row" hidden>
      <button id="btn-finish" data-t="card.exit">Exit</button>
      <button id="btn-again"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
