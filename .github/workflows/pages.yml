# Publishes web/ to GitHub Pages.
#
# Deploying via Actions rather than "branch + folder" because the branch option
# only ever offers / or /docs — it cannot serve an arbitrary directory, and the
# app lives in web/ alongside the Python content pipeline.
name: Deploy PWA to Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'tools/*.mjs'
      # check_deck.py imports core/ and reads the deck, so a change to either
      # must be able to trigger the job that runs it.
      - 'core/**'
      - 'tools/*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check web modules, cross-module calls, ids and strings
        run: node tools/check_js.mjs
      - name: Unit-test the scheduler, session selection and answer matching
        run: node --test tools/test_js.mjs
      - name: Check the deck for card-level mistakes
        run: python3 tools/check_deck.py --quiet
      - name: Check the seed bank is present and parses
        run: |
          python3 -c "
          import json, pathlib, sys
          p = pathlib.Path('web/data/seed_sentences.json')
          if not p.exists():
              sys.exit('seed_sentences.json missing — the app would ship with an empty deck')
          d = json.loads(p.read_text())
          print(f\"{d['count']} sentences\")
          if d['count'] == 0 or d['count'] != len(d['sentences']):
              sys.exit('seed bank is empty or its count is wrong')
          # The app matches bundled sentences to device rows by id; one without
          # an id would arrive as a duplicate whenever its text is corrected.
          ids = [s.get('id') for s in d['sentences']]
          if not all(ids) or len(set(ids)) != len(ids):
              sys.exit('every sentence needs a unique id - save through core/bank.py')
          # Transformation drills ship beside the sentences and share the id
          # space, because on the device they land in the same store.
          tp = pathlib.Path('web/data/transforms.json')
          if tp.exists():
              td = json.loads(tp.read_text())
              tids = [r.get('id') for r in td['transforms']]
              if not all(tids) or len(set(tids) | set(ids)) != len(tids) + len(ids):
                  sys.exit('transform ids must exist and not collide with sentence ids')
              missing = [r for r in td['transforms']
                         if not r.get('stem') or not r.get('transform')]
              if missing:
                  sys.exit('a transform needs a stem and a transformation name')
              print(f"{td['count']} transformation drills")
          "

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
